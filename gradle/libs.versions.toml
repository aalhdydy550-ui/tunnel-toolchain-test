[versions]
# Upgrade-stack test (2026-11-24): every version here is one that
# requires SDK 37 + AGP 9.1.0 — that is exactly what this repo tests.
# All versions were verified to exist on Google Maven / Maven Central
# (maven-metadata.xml) before the repo was created:
# AGP 9.1.0, Kotlin 2.3.21, KSP 2.3.14, Hilt 2.59, Room 2.8.5,
# Compose BOM 2026.11.01, core-ktx 1.19.1, lifecycle 2.11.1,
# hilt-navigation-compose 1.4.0, activity-compose 1.13.0.
# Gradle 9.1.0 (see gradle/wrapper/gradle-wrapper.properties) is the
# Gradle release matching AGP 9.1.0.
agp = "9.1.0"
kotlin = "2.3.21"
ksp = "2.3.14"
hilt = "2.59"
composeBom = "2026.11.01"
room = "2.8.5"
coreKtx = "1.19.1"
lifecycle = "2.11.1"
hiltNavigationCompose = "1.4.0"
activityCompose = "1.13.0"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
